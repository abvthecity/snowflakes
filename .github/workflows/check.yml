name: Checks
# Every job runs on `vars.CI_RUNNER` when it is set (`snowflakes`, the Linux
# containers scripts/runner/ starts on the owner's machine) and on
# `ubuntu-latest` when it is not. `scripts/runner/runner.sh hosted` and `local`
# flip it, so CI moves back to GitHub without a commit when that machine is off.
# Same setup as abvthecity/linklater.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON config
        run: jq empty .mcp.json
      - name: Lint runner scripts
        run: shellcheck scripts/runner/*.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The screenshots render the real app in headless Chromium with software
      # WebGPU (and WebGL for the fallback), so a change that breaks the scene
      # fails here, and the pictures are kept on the run for review.
      - run: pnpm exec playwright install chromium
      - run: pnpm shot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
