name: Checks
# Every job runs on `vars.CI_RUNNER` when it is set (`snowflakes`, the Linux
# containers scripts/runner/ starts on the owner's machine) and on
# `ubuntu-latest` when it is not. `scripts/runner/runner.sh hosted` and `local`
# flip it, so CI moves back to GitHub without a commit when that machine is off.
# Same setup as abvthecity/linklater.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON config
        run: jq empty .mcp.json
      - name: Lint runner scripts
        run: shellcheck scripts/runner/*.sh
