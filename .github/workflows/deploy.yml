name: Deploy
# Builds the app and ships `dist/` to the Cloudflare Pages project `snowflakes`:
# every pull request gets a preview deployment (its URL is posted on the PR),
# and every push to main is the production deployment.
# Saved snowflakes live in D1: production in `snowflakes`, previews in
# `snowflakes-preview` (see wrangler.toml and scripts/d1.sh).
# Needs the repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit, D1: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Runs on the same runner as check.yml.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer preview replaces an older one; production runs one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PAGES_PROJECT: snowflakes
jobs:
  deploy:
    # Forks get no secrets, so there is nothing to deploy with.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4
    steps:
      - name: Check Cloudflare secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the Pages project if it does not exist
        # Fails harmlessly when it already exists; a real auth problem fails
        # the deploy step below with Cloudflare's own message.
        run: $WRANGLER pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: Set up the D1 database
        # Previews get their own database; only main migrates production.
        run: scripts/d1.sh ${{ github.event_name == 'push' && 'production' || 'preview' }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          $WRANGLER pages deploy dist --project-name "$PAGES_PROJECT" --branch "$BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}"
          line="$(jq -c 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)"
          url="$(jq -r '.url' <<<"$line")"
          alias="$(jq -r '.alias // empty' <<<"$line")"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "alias=$alias" >>"$GITHUB_OUTPUT"
          echo "Deployed $url ${alias:+($alias)}" >>"$GITHUB_STEP_SUMMARY"
      - name: Post the preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- cloudflare-pages-preview -->'
          body="$marker
          **Preview:** $URL
          ${ALIAS:+Branch alias (always the latest commit): $ALIAS
          }
          Built from $SHA."
          body="$(sed 's/^ *//' <<<"$body")"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          id="$(curl -fsSL "${auth[@]}" "$API?per_page=100" \
            | jq -r --arg m "$marker" '[.[] | select(.user.type == "Bot" and (.body | startswith($m)))][0].id // empty')"
          payload="$(jq -n --arg b "$body" '{body: $b}')"
          if [ -n "$id" ]; then
            curl -fsSL -X PATCH "${auth[@]}" -d "$payload" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/comments/$id" >/dev/null
          else
            curl -fsSL -X POST "${auth[@]}" -d "$payload" "$API" >/dev/null
          fi
